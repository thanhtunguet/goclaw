name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: thanhtunguet/goclaw-web

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "package_name=goclaw-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Fork develop build: a single rolling "latest build". No SHA in the
            # published file names so they stay human readable and are simply
            # replaced on every run instead of accumulating history.
            echo "version=develop-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "package_name=goclaw" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X github.com/nextlevelbuilder/goclaw/cmd.Version=${VERSION}" \
            -o goclaw .
          PACKAGE_NAME="${{ steps.version.outputs.package_name }}-linux-${{ matrix.goarch }}"
          mkdir -p "$PACKAGE_NAME"
          cp goclaw "$PACKAGE_NAME/"
          cp -R migrations "$PACKAGE_NAME/"
          (cd "$PACKAGE_NAME" && zip -r "../${PACKAGE_NAME}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: goclaw-*.zip

  release-develop:
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-linux-*
          path: dist
          merge-multiple: true

      - name: Publish develop release
        uses: ncipollo/release-action@v1
        with:
          tag: develop
          name: develop
          allowUpdates: true
          # Rolling "latest build" only: drop every existing asset (including the
          # legacy SHA-named zips) before uploading this run's files.
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          artifacts: "dist/*.zip"

  docker-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          IMAGE="${DOCKERHUB_IMAGE}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Build frontend dist
        working-directory: ui/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/web/Dockerfile
          build-args: |
            DIST_DIR=ui/web/dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false
